<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1e17"/>
      <stop offset="50%" stop-color="#1c120d"/>
      <stop offset="100%" stop-color="#140d09"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f2"/>
      <stop offset="100%" stop-color="#eadfd3"/>
    </linearGradient>
    <linearGradient id="cremaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>

  <!-- Warm ambient light glow -->
  <circle cx="300" cy="225" r="220" fill="#b45309" opacity="0.12"/>
  <circle cx="300" cy="225" r="140" fill="#d97706" opacity="0.08"/>

  <!-- Decorative Saucer / Base Plate -->
  <ellipse cx="300" cy="330" rx="160" ry="32" fill="#000000" opacity="0.35"/>
  <ellipse cx="300" cy="324" rx="145" ry="24" fill="#33231b" stroke="#5c4a3e" stroke-width="2"/>
  <ellipse cx="300" cy="320" rx="130" ry="18" fill="#eadfd3"/>

  <!-- Coffee Cup Body -->
  <g filter="url(#shadow)">
    <!-- Cup Handle -->
    <path d="M 370 200 C 430 200, 430 270, 370 270" fill="none" stroke="url(#cupGrad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 370 205 C 418 205, 418 265, 370 265" fill="none" stroke="#2d1e17" stroke-width="8" stroke-linecap="round"/>

    <!-- Cup Outer Shape -->
    <path d="M 210 170 Q 215 300, 300 305 Q 385 300, 390 170 Z" fill="url(#cupGrad)"/>

    <!-- Cup Rim Top -->
    <ellipse cx="300" cy="170" rx="90" ry="24" fill="#faf7f2" stroke="#dfd1c2" stroke-width="2"/>

    <!-- Coffee Liquid & Rich Crema Surface -->
    <ellipse cx="300" cy="172" rx="82" ry="20" fill="#3a2114"/>
    <ellipse cx="300" cy="173" rx="76" ry="17" fill="url(#cremaGrad)"/>

    <!-- Latte Art Heart Swirl -->
    <path d="M 300 182 C 300 182, 280 168, 285 162 C 290 156, 300 162, 300 165 C 300 162, 310 156, 315 162 C 320 168, 300 182, 300 182 Z" fill="#faf7f2" opacity="0.95"/>
    <circle cx="300" cy="165" r="2.5" fill="#faf7f2" opacity="0.9"/>
  </g>

  <!-- Steam Whisps -->
  <path d="M 275 135 Q 265 105, 285 85 Q 295 70, 290 55" fill="none" stroke="#faf7f2" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M 305 130 Q 320 100, 305 75 Q 295 60, 310 45" fill="none" stroke="#faf7f2" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M 330 135 Q 345 110, 335 90 Q 325 75, 335 60" fill="none" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Brand Typography Overlay -->
  <g opacity="0.95">
    <rect x="210" y="380" width="180" height="34" rx="17" fill="#1c120d" stroke="#b45309" stroke-width="1.5"/>
    <text x="300" y="402" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#faf7f2" letter-spacing="1.5">
      OUR COFFEE
    </text>
  </g>
</svg>
